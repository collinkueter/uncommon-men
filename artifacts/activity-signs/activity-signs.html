<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uncommon Men event signs</title>
  <style>
    @import url("../../node_modules/@fontsource/barlow/400.css");
    @import url("../../node_modules/@fontsource/barlow/600.css");
    @import url("../../node_modules/@fontsource/barlow/700.css");
    @import url("../../node_modules/@fontsource/barlow-condensed/800.css");
    @import url("../../node_modules/@fontsource/barlow-condensed/900.css");

    :root { color-scheme: light; font-family: "Barlow", Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #d7dad1; color: #172019; }
    #sheets { display: grid; gap: 1.25rem; justify-content: center; padding: 0 1rem 2rem; }
    .sheet { width: 8.5in; height: 11in; position: relative; display: flex; flex-direction: column; overflow: hidden; background: #fbfbf6; box-shadow: 0 8px 30px #0003; }
    .top { min-height: 1.2in; padding: .37in .55in .28in; display: flex; align-items: flex-start; justify-content: space-between; gap: .3in; background: linear-gradient(90deg, #172019 51%, #172019d9), url("../../public/brand/camo.svg") right center / 3.2in auto; color: #f7f8f0; }
    .brand { font: 900 31pt/.86 "Barlow Condensed", Impact, sans-serif; letter-spacing: -.02em; transform: skew(-4deg); }
    .brand em { color: #cce84e; font-style: normal; }
    .brand-rule { width: 2.1in; height: 5px; margin-top: .15in; background: #cce84e; transform: skew(-18deg); }
    .top-label { padding-top: .03in; text-align: right; text-transform: uppercase; line-height: 1.2; color: #e7ecd9; font-size: 9.5pt; font-weight: 600; letter-spacing: .15em; }
    .content { flex: 1; padding: .5in .58in .3in; display: flex; flex-direction: column; }
    h1 { max-width: 7.2in; margin: 0 0 .29in; padding-bottom: .25in; border-bottom: 2px solid #ccd5bd; font: 900 42pt/.94 "Barlow Condensed", Impact, sans-serif; letter-spacing: -.01em; text-transform: uppercase; overflow-wrap: anywhere; }
    .how-label { margin: 0 0 .1in; color: #476026; font-size: 12pt; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .lead { margin: 0 0 .34in; font-size: 19pt; line-height: 1.24; font-weight: 600; }
    .result-box { padding: .24in .28in .27in; border: 1px solid #aebba0; border-top: 4px solid #b9d734; background: #f0f3e5; }
    .result-box h2 { margin: 0 0 .12in; font-size: 12pt; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .result-box p { margin: 0; font-size: 22pt; font-weight: 700; line-height: 1.16; }
    .format { margin: .28in 0 0; font-size: 15pt; line-height: 1.3; }
    .format strong { font-weight: 700; }
    .timing-note { margin: .16in 0 0; font-size: 14pt; line-height: 1.25; font-weight: 600; color: #355020; }
    .spacer { flex: 1; min-height: .18in; }
    .cta { display: grid; grid-template-columns: 1fr 1.65in; gap: .22in; align-items: center; padding: .25in; border-top: 4px solid #b9d734; background: #172019; color: #fff; }
    .cta h2 { margin: 0 0 .09in; color: #d8f35c; font: 900 25pt/.95 "Barlow Condensed", Impact, sans-serif; text-transform: uppercase; }
    .cta p { margin: 0 0 .11in; font-size: 13pt; line-height: 1.25; }
    .cta a { color: #fff; font-size: 15pt; font-weight: 700; text-decoration: underline; text-underline-offset: .08in; overflow-wrap: anywhere; }
    .qr { width: 1.65in; height: 1.65in; padding: .1in; border: 1px solid #d8f35c; background: #fff; }
    .qr img { width: 100%; height: 100%; display: block; }
    .footer { display: flex; justify-content: flex-end; align-items: center; margin-top: .17in; color: #51604e; font-size: 10.5pt; }
    .footer strong { color: #172019; letter-spacing: .08em; }
    @page { size: letter; margin: 0; }
    @media print {
      html, body { background: #fff; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      #sheets { display: block; padding: 0; }
      .sheet { width: 8.5in; height: 11in; margin: 0; box-shadow: none; break-after: page; page-break-after: always; }
      .sheet:last-child { break-after: auto; page-break-after: auto; }
    }
    @media screen and (max-width: 850px) {
      #sheets { justify-content: start; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <main id="sheets"></main>
  <script>
    const website = "https://uncommon-men.web.app/";
    const activities = [
      { id: "dumbbell-hold-15-lb", name: "Dumbbell Hold - 15 lb", description: "Hold a 15 lb dumbbell in each hand. Stand tall and raise both arms out to the sides at shoulder height, parallel to the floor, with a slight elbow bend. The clock stops if you lean or either arm drops below shoulder height.", record: "Seconds held with 15 lb in each hand. Longest valid hold wins.", format: "Individual 15 lb division", timed: true },
      { id: "dumbbell-hold-20-lb", name: "Dumbbell Hold - 20 lb", description: "Hold a 20 lb dumbbell in each hand. Stand tall and raise both arms out to the sides at shoulder height, parallel to the floor, with a slight elbow bend. The clock stops if you lean or either arm drops below shoulder height.", record: "Seconds held with 20 lb in each hand. Longest valid hold wins.", format: "Individual 20 lb division", timed: true },
      { id: "push-up", name: "Push Up", description: "Keep your body straight from shoulders to ankles. Lower as one unit until your upper arms are parallel to the floor, then rise until your elbows fully extend. Only complete, straight-body repetitions count.", record: "Number of valid repetitions. Most reps wins.", format: "Individual count attempt" },
      { id: "plank-holds", name: "Plank Holds", description: "Rest on your forearms and toes with elbows beneath your shoulders. Keep a straight line from head to heels; do not lift a hand or foot, let your hips sag, or raise them. Time ends when you lose the position.", record: "Seconds held in position. Longest valid hold wins.", format: "Individual timed attempt", timed: true },
      { id: "cornhole", name: "Cornhole", description: "Play in teams of two. Opponents alternate four bag tosses per player. A bag on the board scores 1; a bag through the hole scores 3. Subtract the lower team's frame points from the higher team's; first to 21 after a frame wins.", record: "Winning team for each bracket match.", format: "Two-person team bracket" },
      { id: "basketball-free-throws", name: "Basketball Free Throws", description: "Shoot from behind the free-throw line with no defender. Make as many free throws in a row as you can. Keep your feet behind the line until the ball reaches the rim or goes through. Your streak ends on the first miss.", record: "Highest number of consecutive free throws made in a row. The longest streak wins.", format: "Individual streak attempt" },
      { id: "lightning-knockout", name: "Lightning / Knockout", description: "Line up at the free-throw or three-point line with two balls. The first two players shoot in order. After a miss, rebound and keep shooting; if the player behind scores first, you are out. Last player standing wins.", record: "Winner of the Knockout game.", format: "Individual elimination game" },
      { id: "pound-the-nail", name: "Pound the Nail the Fastest", description: "Start with an identical nail already set in the stump. On the signal, hammer until the head is flush with the wood. Keep your free hand clear while striking; the clock stops at a flush finish.", record: "Elapsed time in seconds. Fastest valid finish wins.", format: "Individual timed attempt", timed: true },
      { id: "grid-based-logic-puzzle", name: "Grid Based Logic Puzzle", description: "Use the printed clues to match each item once in every category. Mark confirmed matches and cross out impossible ones until the grid is fully solved. Stop the clock only after the answer is checked as correct.", record: "Seconds to a correct solution. Fastest wins.", format: "Individual timed attempt", timed: true },
      { id: "sudoku", name: "Sudoku", description: "Fill every empty square with a digit from 1 to 9. Each row, column, and outlined 3-by-3 box must contain each digit once. Stop the clock only after the completed grid is checked as correct.", record: "Seconds to a correct solution. Fastest wins.", format: "Individual timed attempt", timed: true },
      { id: "chess", name: "Chess", description: "White moves first; players alternate legal moves. Protect your king while trying to checkmate the other king - an attack with no legal escape. Checkmate or resignation wins; a drawn game must be replayed for the bracket.", record: "Winner of each bracket match.", format: "Individual bracket" },
      { id: "checkers", name: "Checkers", description: "Move diagonally on dark squares and jump to capture whenever a jump is available. Reach the far row to crown a king, which may move backward. Win when your opponent has no pieces or no legal move; replay a draw.", record: "Winner of each bracket match.", format: "Individual bracket" },
      { id: "table-tennis", name: "Table Tennis", description: "Serve so the ball bounces on your side, then your opponent's. Rally over the net, letting it bounce once on your side before returning it. Games go to 11, win by 2; play best of three games.", record: "Winner of each bracket match.", format: "Individual bracket" },
      { id: "carpet-ball", name: "Carpet Ball", description: "Place five balls at each end of the carpeted table. Take turns rolling the cue ball to knock your opponent's balls into the tray. After one side clears the other, the opponent gets one mercy roll; if both clear, replay with one fewer ball per side. A ball off the table forfeits the game.", record: "Winner of each bracket match.", format: "Individual bracket" },
      { id: "foosball", name: "Foosball", description: "Play in teams of two and move the rods to shoot into the opposing goal. A goal counts when the ball crosses the goal line. Do not spin the rods. First to five goals wins a game; play best of three.", record: "Winning team for each bracket match.", format: "Two-person team bracket" },
    ];
    const escapeHtml = value => value.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");
    const activityUrl = activity => `${website}events/${activity.id}`;
    document.querySelector("#sheets").innerHTML = activities.map((activity, index) => `
      <article class="sheet" aria-label="${escapeHtml(activity.name)} event sign">
        <header class="top"><div><div class="brand">UNCOMMON <em>MEN</em></div><div class="brand-rule"></div></div><div class="top-label">EVENT GUIDE</div></header>
        <div class="content">
          <h1>${escapeHtml(activity.name)}</h1>
          <h2 class="how-label">How to play</h2>
          <p class="lead">${escapeHtml(activity.description)}</p>
          <div class="result-box"><h2>What we record</h2><p>${escapeHtml(activity.record)}</p></div>
          <p class="format"><strong>Format:</strong> ${escapeHtml(activity.format)}</p>
          ${activity.timed ? '<p class="timing-note">No stopwatch or timer? Use the built-in stopwatch on this event\'s app page.</p>' : ''}
          <div class="spacer"></div>
          <div class="cta"><div><h2>Open this event</h2><p>The QR opens this event directly. Or type the URL and choose it from the list.</p><a href="${website}">${website}</a></div><div class="qr"><img src="qr-${activity.id}.svg" alt="QR code for ${activityUrl(activity)}"></div></div>
          <div class="footer"><strong>${String(index + 1).padStart(2, "0")} / ${activities.length}</strong></div>
        </div>
      </article>
    `).join("");
  </script>
</body>
</html>
